name: Build + Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'master'
  schedule:
    - cron: '30 8 * * *'
      timezone: 'Europe/Berlin'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta for runner
        id: meta-runner
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/act_runner-docuum-dind
            ${{ secrets.DOCKERHUB_USERNAME }}/gitea-runner-docuum-dind
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{raw}}
            type=schedule,pattern=nightly

      - name: Docker meta for cache
        id: meta-cache
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/gitea-runner-cache
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{raw}}
            type=schedule,pattern=nightly

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build-args
        id: buildargs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo gitea_runner_dind_image="GITEA_RUNNER_DIND_IMAGE=docker.io/gitea/runner:nightly-dind" | tee $GITHUB_OUTPUT
          fi

      - name: Build and push runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-runner.outputs.tags }}
          labels: ${{ steps.meta-runner.outputs.labels }}
          build-args: |
            ${{ steps.buildargs.outputs.gitea_runner_dind_image }}

      - name: Build and push cache image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: cache
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-cache.outputs.tags }}
          labels: ${{ steps.meta-cache.outputs.labels }}
          build-args: |
            ${{ steps.buildargs.outputs.gitea_runner_dind_image }}